version: 2
updates:
  # .NET / NuGet dependencies for the TotallyHotArcRouter solution. Dependabot discovers every .csproj
  # under this directory recursively. Grouped so routine bumps arrive as one PR per week instead of
  # one per package. Security updates for known-vulnerable packages are raised automatically and are
  # not limited by open-pull-requests-limit.
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns:
          - "*"

  # GitHub Actions workflows live under .github/workflows at the repo root, so this must point at "/",
  # not "/src" (the previous value never matched anything).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

# Note: this file covers only the first-party .NET code and the repo's GitHub Actions. No npm
# version-update entries are configured elsewhere in the tree, since there are no first-party npm
# manifests left to track (the same scoping applied to code scanning). Dependabot still raises
# *security* alerts/PRs automatically for any vendored manifests that remain; those are triaged
# separately.
