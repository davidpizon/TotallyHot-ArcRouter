# CodeQL advanced-setup config, used by .github/workflows/codeql.yml.
#
# Scope code scanning to the first-party .NET code under src/. litellm-sidecar/ is a vendored
# third-party component; its source is not maintained in this repository, so security fixes for it
# belong upstream. The workflow already analyzes C# only, and this ignore is belt-and-suspenders so
# the vendored path is never extracted.
paths:
  - src
paths-ignore:
  - litellm-sidecar
  - "**/*.min.js"
