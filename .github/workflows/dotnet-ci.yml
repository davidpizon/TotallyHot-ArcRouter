name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this job only checks out code and runs dotnet build/test, it never
# writes back to the repo or calls any other GitHub API.
permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # TotallyHotArcRouter.Gui.csproj targets net10.0-windows (a Windows-only MAUI app) and is
      # intentionally excluded here - it cannot build on a Linux runner. Every other project,
      # including its supporting libraries (TotallyHotArcRouter.Gui.Charts/.Console/.Telemetry), targets
      # plain net10.0 by design specifically so it builds and tests cross-platform (see the
      # "Plain net10.0 (not net10.0-windows / MAUI)" comments in those csproj files). Each project
      # below is a test project; restoring/building it also covers the production project(s) it
      # references via ProjectReference, so no separate list of production projects is needed.
      PROJECTS: >-
        src/TotallyHotArcRouter.Tests/TotallyHotArcRouter.Tests.csproj
        src/TotallyHotArcRouter.Quality.Tests/TotallyHotArcRouter.Quality.Tests.csproj
        src/TotallyHotArcRouter.Gui.Admin.Tests/TotallyHotArcRouter.Gui.Admin.Tests.csproj
        src/TotallyHotArcRouter.Gui.Charts.Tests/TotallyHotArcRouter.Gui.Charts.Tests.csproj
        src/TotallyHotArcRouter.Gui.Console.Tests/TotallyHotArcRouter.Gui.Console.Tests.csproj
        src/TotallyHotArcRouter.Gui.Telemetry.Tests/TotallyHotArcRouter.Gui.Telemetry.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # NOTE: an "Allow unprivileged user namespaces" step used to sit here, loosening
      # kernel.apparmor_restrict_unprivileged_userns so a jail-launch test could call `unshare --user
      # --map-root-user`. Both the test and the jail are gone: the verifier no longer executes
      # model-generated code (docs/router/quality-verifier-architecture.md), so CI needs no elevated
      # namespace capability and the runner is left at its default hardening.

      - name: Restore
        run: |
          set -euo pipefail
          for proj in $PROJECTS; do
            echo "::group::dotnet restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          set -euo pipefail
          for proj in $PROJECTS; do
            echo "::group::dotnet build $proj"
            dotnet build "$proj" --configuration Release --no-restore
            echo "::endgroup::"
          done

      # coverage.runsettings (repo root) configures Microsoft.Testing.Extensions.CodeCoverage's exclusions
      # (module/source/function patterns - see the "Check coverage threshold" step below for what and why).
      # It intentionally has NO XML comments in it: Microsoft.Testing.Extensions.CodeCoverage 18.10.0's
      # settings parser silently fails on any comment in that file - the run reports "Zero tests ran" with
      # no further diagnostic - confirmed empirically while migrating off coverlet (xunit.v3/Microsoft.Testing.Platform
      # dropped support for coverlet's VSTest-based data collector on the .NET 10 SDK, see https://aka.ms/dotnet-test-mtp-error).
      - name: Test
        run: |
          set -euo pipefail
          for proj in $PROJECTS; do
            echo "::group::dotnet test $proj"
            name=$(basename "$proj" .csproj)
            dotnet test "$proj" --configuration Release --no-restore --no-build \
              --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings \
              --coverage-output "TestResults/$name/coverage.cobertura.xml" \
              --results-directory "TestResults/$name"
            echo "::endgroup::"
          done

      # AGENTS.md requires >=80% code coverage. coverage.runsettings (repo root) already excludes
      # generated/non-testable code (protobuf stubs, MAUI/WinRT bootstrap) from the line-coverage math
      # so the bar reflects code we actually own. TotallyHotArcRouter.Gui/.Gui.Tests aren't in $PROJECTS
      # (Windows-only MAUI, can't build/test on this Linux runner - same exclusion as Build/Test above)
      # so they're checked against this same 80% bar by the windows-gui-build-and-test job below instead;
      # see coverage.runsettings' own comment for why the split exists.
      - name: Check coverage threshold
        run: |
          set -euo pipefail
          dotnet tool install -g dotnet-reportgenerator-globaltool
          # `dotnet tool install -g` puts the shim in ~/.dotnet/tools, which isn't guaranteed to be on
          # PATH for this step (only guaranteed for later steps once GITHUB_PATH takes effect) - add it
          # explicitly so `reportgenerator` below resolves. Prepended, not appended: an already-installed
          # reportgenerator earlier on PATH (e.g. preinstalled on the runner) must not shadow the version
          # just installed above.
          export PATH="$HOME/.dotnet/tools:$PATH"
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/Report" \
            "-reporttypes:JsonSummary;TextSummary"
          cat TestResults/Report/Summary.txt
          python3 - <<'PY'
          import json
          import sys

          with open("TestResults/Report/Summary.json") as f:
              data = json.load(f)

          threshold = 80.0
          failures = [
              (a["name"], a["coverage"])
              for a in data["coverage"]["assemblies"]
              if a["coverage"] < threshold
          ]

          if failures:
              print(f"::error::The following assemblies are below the {threshold}% line coverage bar required by AGENTS.md:")
              for name, coverage in failures:
                  print(f"::error::  {name}: {coverage}%")
              sys.exit(1)

          print(f"All assemblies meet the {threshold}% line coverage bar.")
          PY

  windows-gui-build-and-test:
    name: Build and test GUI (Windows/MAUI)
    # Deliberately disabled (repo owner's decision, not a build failure): skips the MAUI build/test/coverage
    # run below rather than removing the job, so it stays visible - as skipped - in the Actions UI and
    # re-enabling it is a one-line revert. Re-enabling also restores AGENTS.md's 80% coverage bar for
    # TotallyHotArcRouter.Gui, which this job is what enforces - see the "Check coverage threshold" step's
    # own comment.
    if: false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # TotallyHotArcRouter.Gui.csproj is the only project needing this - see its
      # `UseMaui Condition="...IsOSPlatform('windows')"` guard. The Linux job above never
      # touches it (see its $PROJECTS comment), so it's built here instead, on a
      # windows-latest runner where the MAUI workload can actually be installed.
      # maui-windows (not the full maui workload) matches this project's single
      # net10.0-windows TFM - no android/ios/maccatalyst targets exist here to justify the
      # extra install time of the other platform workloads.
      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore
        run: |
          dotnet restore src/TotallyHotArcRouter.Gui/TotallyHotArcRouter.Gui.csproj
          dotnet restore src/TotallyHotArcRouter.Gui.Tests/TotallyHotArcRouter.Gui.Tests.csproj

      - name: Build
        run: dotnet build src/TotallyHotArcRouter.Gui/TotallyHotArcRouter.Gui.csproj --configuration Release --no-restore

      # TotallyHotArcRouter.Gui.Tests uses bUnit to render the already-compiled Razor components with its
      # own renderer (see the project's own comment) - it needs the net10.0-windows TFM to reference
      # TotallyHotArcRouter.Gui directly, but does not start a MAUI runtime.
      - name: Test
        run: |
          dotnet test src/TotallyHotArcRouter.Gui.Tests/TotallyHotArcRouter.Gui.Tests.csproj `
            --configuration Release --no-restore `
            --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings `
            --coverage-output TestResults/TotallyHotArcRouter.Gui.Tests/coverage.cobertura.xml `
            --results-directory TestResults/TotallyHotArcRouter.Gui.Tests

      # Mirrors the Linux job's coverage gate (same coverage.runsettings, same AGENTS.md 80% bar) for
      # the one assembly that can only be measured on Windows - see coverage.runsettings' own comment
      # for why TotallyHotArcRouter.Gui/.Gui.Tests were previously checked here only by hand.
      # -assemblyfilters restricts the report to TotallyHotArcRouter.Gui itself: TotallyHotArcRouter.Gui.Tests
      # (bUnit) also links TotallyHotArcRouter.Gui.Admin/.Charts/.Console/.Telemetry through Gui's
      # ProjectReferences, but only touches slivers of them - those assemblies already have their own
      # dedicated test projects and 80% bar on the Linux job above, so including them here would fail
      # the gate on coverage this job was never meant to provide.
      - name: Check coverage threshold
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          reportgenerator `
            "-reports:TestResults/**/coverage.cobertura.xml" `
            "-targetdir:TestResults/Report" `
            "-reporttypes:JsonSummary;TextSummary" `
            "-assemblyfilters:+TotallyHotArcRouter.Gui"
          Get-Content TestResults/Report/Summary.txt

          $threshold = 80.0
          $data = Get-Content TestResults/Report/Summary.json -Raw | ConvertFrom-Json
          $failures = $data.coverage.assemblies | Where-Object { $_.coverage -lt $threshold }

          if ($failures) {
            Write-Host "::error::The following assemblies are below the $threshold% line coverage bar required by AGENTS.md:"
            foreach ($f in $failures) {
              Write-Host "::error::  $($f.name): $($f.coverage)%"
            }
            exit 1
          }

          Write-Host "All assemblies meet the $threshold% line coverage bar."
