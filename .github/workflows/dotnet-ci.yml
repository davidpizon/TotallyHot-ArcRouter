name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this as its test gate, so a release is held to exactly the bar a pull request is.
  workflow_call:

# Least-privilege default: this job only checks out code and runs dotnet build/test, it never
# writes back to the repo or calls any other GitHub API.
permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # TotallyHotArcRouter.Tray.csproj targets net10.0-windows (WinForms) and is intentionally excluded
      # here - it cannot build on a Linux runner. Every other project, including the former MAUI
      # TotallyHotArcRouter.Gui's replacement TotallyHotArcRouter.Gui.Components (web GUI migration plan
      # Phase P9 deleted TotallyHotArcRouter.Gui/.Gui.Tests outright) and Tray.Core (Tray's cross-platform
      # logic library), targets plain net10.0 by design specifically so it builds and tests cross-platform
      # (see the "Plain net10.0 (not net10.0-windows / MAUI)" comments in those csproj files). Each
      # project below is a test project; restoring/building it also covers the production project(s) it
      # references via ProjectReference, so no separate list of production projects is needed.
      PROJECTS: >-
        src/TotallyHotArcRouter.Tests/TotallyHotArcRouter.Tests.csproj
        src/TotallyHotArcRouter.Quality.Tests/TotallyHotArcRouter.Quality.Tests.csproj
        src/TotallyHotArcRouter.Gui.Admin.Tests/TotallyHotArcRouter.Gui.Admin.Tests.csproj
        src/TotallyHotArcRouter.Gui.Charts.Tests/TotallyHotArcRouter.Gui.Charts.Tests.csproj
        src/TotallyHotArcRouter.Gui.Components.Tests/TotallyHotArcRouter.Gui.Components.Tests.csproj
        src/TotallyHotArcRouter.Gui.Console.Tests/TotallyHotArcRouter.Gui.Console.Tests.csproj
        src/TotallyHotArcRouter.Gui.Telemetry.Tests/TotallyHotArcRouter.Gui.Telemetry.Tests.csproj
        src/TotallyHotArcRouter.Tray.Core.Tests/TotallyHotArcRouter.Tray.Core.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # NOTE: an "Allow unprivileged user namespaces" step used to sit here, loosening
      # kernel.apparmor_restrict_unprivileged_userns so a jail-launch test could call `unshare --user
      # --map-root-user`. Both the test and the jail are gone: the verifier no longer executes
      # model-generated code (docs/router/quality-verifier-architecture.md), so CI needs no elevated
      # namespace capability and the runner is left at its default hardening.

      - name: Restore
        run: |
          set -euo pipefail
          for proj in $PROJECTS; do
            echo "::group::dotnet restore $proj"
            dotnet restore "$proj"
            echo "::endgroup::"
          done

      - name: Build
        run: |
          set -euo pipefail
          for proj in $PROJECTS; do
            echo "::group::dotnet build $proj"
            dotnet build "$proj" --configuration Release --no-restore
            echo "::endgroup::"
          done

      # coverage.runsettings (repo root) configures Microsoft.Testing.Extensions.CodeCoverage's exclusions
      # (module/source/function patterns - see the "Check coverage threshold" step below for what and why).
      # It intentionally has NO XML comments in it: Microsoft.Testing.Extensions.CodeCoverage 18.10.0's
      # settings parser silently fails on any comment in that file - the run reports "Zero tests ran" with
      # no further diagnostic - confirmed empirically while migrating off coverlet (xunit.v3/Microsoft.Testing.Platform
      # dropped support for coverlet's VSTest-based data collector on the .NET 10 SDK, see https://aka.ms/dotnet-test-mtp-error).
      - name: Test
        run: |
          set -euo pipefail
          for proj in $PROJECTS; do
            echo "::group::dotnet test $proj"
            name=$(basename "$proj" .csproj)
            dotnet test "$proj" --configuration Release --no-restore --no-build \
              --coverage --coverage-output-format cobertura --coverage-settings coverage.runsettings \
              --coverage-output "TestResults/$name/coverage.cobertura.xml" \
              --results-directory "TestResults/$name"
            echo "::endgroup::"
          done

      # AGENTS.md requires >=80% code coverage. coverage.runsettings (repo root) already excludes
      # generated/non-testable code (protobuf stubs, WinForms designer bootstrap) from the line-coverage
      # math so the bar reflects code we actually own. TotallyHotArcRouter.Tray isn't in $PROJECTS
      # (Windows-only WinForms shell, [ExcludeFromCodeCoverage] throughout per AGENTS.md's platform-shell
      # convention - can't build/test on this Linux runner and has no logic of its own to cover, unlike
      # Tray.Core, which is in $PROJECTS above and checked against this same bar).
      - name: Check coverage threshold
        run: |
          set -euo pipefail
          dotnet tool install -g dotnet-reportgenerator-globaltool
          # `dotnet tool install -g` puts the shim in ~/.dotnet/tools, which isn't guaranteed to be on
          # PATH for this step (only guaranteed for later steps once GITHUB_PATH takes effect) - add it
          # explicitly so `reportgenerator` below resolves. Prepended, not appended: an already-installed
          # reportgenerator earlier on PATH (e.g. preinstalled on the runner) must not shadow the version
          # just installed above.
          export PATH="$HOME/.dotnet/tools:$PATH"
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/Report" \
            "-reporttypes:JsonSummary;TextSummary"
          cat TestResults/Report/Summary.txt
          python3 - <<'PY'
          import json
          import sys

          with open("TestResults/Report/Summary.json") as f:
              data = json.load(f)

          threshold = 80.0
          failures = [
              (a["name"], a["coverage"])
              for a in data["coverage"]["assemblies"]
              if a["coverage"] < threshold
          ]

          if failures:
              print(f"::error::The following assemblies are below the {threshold}% line coverage bar required by AGENTS.md:")
              for name, coverage in failures:
                  print(f"::error::  {name}: {coverage}%")
              sys.exit(1)

          print(f"All assemblies meet the {threshold}% line coverage bar.")
          PY
