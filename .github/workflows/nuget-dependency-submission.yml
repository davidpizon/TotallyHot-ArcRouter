name: NuGet Dependency Submission

# Replaces GitHub's auto-generated "Automatic Dependency Submission (NuGet)" workflow
# (dynamic/dependency-graph/auto-submission) which fails because the MAUI Blazor Hybrid
# project (TotallyHotArcRouter.Gui) requires the maui-tizen workload and the auto-generated
# workflow restores all projects without installing workloads first.
#
# Creating a custom workflow that calls actions/component-detection-dependency-submission-action
# causes GitHub to use this workflow instead of the auto-generated one.
#
# Reference: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/configuring-automatic-dependency-submission-for-your-repository

on:
  push:

# Dependency submission requires write access to the dependency graph.
permissions:
  contents: write

jobs:
  submit-nuget:
    name: submit-nuget
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Match the SDK versions used by the auto-generated workflow so all
          # TargetFramework values in the solution (net8.0, net9.0, net10.0) resolve.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # TotallyHotArcRouter.Gui targets net10.0-windows with <UseMaui>true/>, so this workflow
      # runs on Windows and installs MAUI workloads before restore.
      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: Windows-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: Windows-nuget-

      - name: Restore all projects
        shell: bash
        run: |
          set -euo pipefail
          project_files=$(find . -type f \
            \( -name "*.csproj" -o -name "*.sln" -o -name "*.vbproj" -o -name "*.fsproj" \) \
            | grep -v '/obj/' | grep -v '/bin/' | head -20)
          if [ -z "$project_files" ]; then
            echo "::error::No .NET project files found in repository"
            exit 1
          fi
          echo "Found project files:"
          echo "$project_files"
          while IFS= read -r project; do
            echo "Restoring project: $project"
            dotnet restore "$project"
          done <<< "$project_files"

      - name: Detect and submit NuGet dependencies
        uses: actions/component-detection-dependency-submission-action@98beaea5a1227f3db476e4c9ca959a0cacd7ac4f
