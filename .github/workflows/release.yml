name: Release

# Tag-triggered: a "v<MAJOR>.<MINOR>.<PATCH>" tag (e.g. v1.2.3) on a commit reachable from main builds every
# release asset (web GUI migration plan Phase P10's packaging matrix) and publishes them plus a single
# combined checksums.txt as GitHub Release assets, in the shape GitHubReleaseCheckClient expects: exactly
# one platform-matching installer/archive asset (a *.msi* on Windows, a totallyhotarcrouter-<rid>.tar.gz
# elsewhere) and one checksums.txt asset containing a `<sha256 hex>  <filename>` line for it
# (docs/router/packaging-and-distribution.md; GitHubReleaseCheckClient.MatchesCurrentPlatform).
#
# This workflow is stage one of two: it always publishes the release as a PRERELEASE - a release
# candidate - never as `latest`. GitHub's /repos/{owner}/{repo}/releases/latest endpoint, which
# GitHubReleaseCheckClient polls, excludes prereleases by definition, so a build published here is
# invisible to every installed Router until it is deliberately nominated. Stage two is promote.yml,
# which flips the same release to `latest` WITHOUT rebuilding - so what operators install is the
# byte-identical artifact that was tested as the RC, and its published checksum still covers it.
#
# Every platform job publishes to a job-scoped actions/upload-artifact, not straight to the GitHub
# Release: attaching assets from several parallel jobs to the same release racily is exactly the kind of
# "worked in testing, corrupted checksums.txt in production" bug this avoids - the final publish-release
# job downloads everything once every build has finished, computes ONE combined checksums.txt covering
# every asset, and creates the release in a single step.
#
# The tag is the release version's single source of truth (docs/router/packaging-and-distribution.md §7):
# every build below receives it as -p:Version, overriding Directory.Build.props' <Version>, which is only
# the fallback for local builds. Tags normally come from cut-release.yml, which dispatches this workflow
# against the tag it just pushed (a tag pushed with its GITHUB_TOKEN cannot trigger `push` below); a
# hand-pushed tag still triggers it through `push`. A manual dispatch must select a tag ref, or
# verify-version fails.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify-version:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fail fast, before any build or test minute is spent, on a ref that cannot be a release:
      #  - not a tag at all (a workflow_dispatch started from a branch);
      #  - not strict vMAJOR.MINOR.PATCH - GitHubReleaseCheckClient parses the tag with System.Version,
      #    which rejects any "-rc.1"-style suffix, so such a release would surface as MalformedTag;
      #  - beyond Windows Installer's 255.255.65535 ProductVersion range, where MajorUpgrade stops working;
      #  - on a commit that is not on main, i.e. code that never passed review.
      - name: Verify
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Run against a release tag (gh workflow run release.yml --ref v1.2.3), not ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '${tag}' is not vMAJOR.MINOR.PATCH (no leading zeros, no prerelease suffix)."
            exit 1
          fi

          # Field length first: Bash integers silently wrap past 64 bits, so an over-long field must be
          # rejected before (( )) ever compares it (v999999999999999999999.0.0 could otherwise pass).
          if (( ${#BASH_REMATCH[1]} > 3 || ${#BASH_REMATCH[2]} > 3 || ${#BASH_REMATCH[3]} > 5 )) ||
             (( BASH_REMATCH[1] > 255 || BASH_REMATCH[2] > 255 || BASH_REMATCH[3] > 65535 )); then
            echo "::error::Tag '${tag}' exceeds Windows Installer's ProductVersion limit of 255.255.65535."
            exit 1
          fi

          commit=$(git rev-parse "${tag}^{commit}")
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::Tag '${tag}' points at ${commit}, which is not on main. Release only reviewed code."
            exit 1
          fi

          echo "Releasing ${tag} from ${commit}."
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  # The full CI suite (build, tests, the 80% coverage bar) against the tagged commit - called, not copied,
  # so the release gate can never drift from what pull requests are held to. Every job that publishes
  # anything, including the container push, waits on it.
  test:
    name: Test
    needs: verify-version
    uses: ./.github/workflows/dotnet-ci.yml

  build-msi:
    name: Build MSI (win-x64)
    needs: [verify-version, test]
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore src/TotallyHotArcRouter/TotallyHotArcRouter.csproj
          dotnet restore src/TotallyHotArcRouter.Tray/TotallyHotArcRouter.Tray.csproj

      # Publishes both apps with their `Service` publish profile (win-x64, SelfContained=true - see
      # TotallyHotArcRouter.csproj's Phase P10 comment on why win-x64 is now only the profile's DEFAULT
      # RuntimeIdentifier, not a hardcoded one) - the exact layout the installer project's
      # RouterPublishDir/TrayPublishDir default to, and what TotallyHotArcRouter.Installer.wixproj
      # packages via <Files Include="..."> harvesting (Package.wxs). -p:Version stamps the tag's version
      # into both apps' assemblies and, through the .wixproj's ProductVersion=$(Version), into the MSI.
      - name: Publish Router
        run: dotnet publish src/TotallyHotArcRouter/TotallyHotArcRouter.csproj -c Release -p:PublishProfile=Service -p:Version=$env:RELEASE_VERSION

      - name: Publish Tray
        run: dotnet publish src/TotallyHotArcRouter.Tray/TotallyHotArcRouter.Tray.csproj -c Release -p:PublishProfile=Service -p:Version=$env:RELEASE_VERSION

      - name: Build MSI
        run: dotnet build src/TotallyHotArcRouter.Installer/TotallyHotArcRouter.Installer.wixproj -c Release -p:Version=$env:RELEASE_VERSION

      # TODO(signing): the MSI produced here is UNSIGNED - no code-signing certificate exists yet for this
      # project (docs/router/packaging-and-distribution.md tracks this as an open prerequisite). Once one
      # exists, add a `signtool sign /fd SHA256 /a /tr <timestamp-url> /td SHA256 <msi>` step here, before
      # the checksum is computed in publish-release below, so the published checksum covers the signed
      # artifact. Without signing, Windows SmartScreen will warn on install and MsiUpdateApplier's future
      # Authenticode verification (its own TODO) has nothing to check yet.
      - name: Rename MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $msiSource = Get-ChildItem -Path "src/TotallyHotArcRouter.Installer/bin/x64/Release" -Filter "*.msi" -Recurse | Select-Object -First 1
          Copy-Item $msiSource.FullName "release-assets/TotallyHotArcRouter-$env:RELEASE_VERSION.msi"
          Get-ChildItem release-assets

      # The version arrives as a command-line override rather than a committed file, so prove it landed in
      # both places the update pipeline reads before anything is published: the MSI's ProductVersion (what
      # MajorUpgrade compares) and the Router assembly's informational version (what
      # GitHubReleaseCheckClient reports as current - a mismatch there is an endless "update available").
      - name: Verify stamped versions
        shell: pwsh
        run: |
          $msi = (Resolve-Path "release-assets/TotallyHotArcRouter-$env:RELEASE_VERSION.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0))
          $view = $database.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $database, @("SELECT Value FROM Property WHERE Property = 'ProductVersion'"))
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          $productVersion = $record.GetType().InvokeMember("StringData", "GetProperty", $null, $record, 1)
          $view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null) | Out-Null

          $routerDll = "src/TotallyHotArcRouter/bin/Publish/Service/TotallyHotArcRouter.dll"
          $routerVersion = (Get-Item $routerDll).VersionInfo.ProductVersion -replace '\+.*$', ''

          Write-Host "MSI ProductVersion:    $productVersion"
          Write-Host "Router ProductVersion: $routerVersion"
          if ($productVersion -ne $env:RELEASE_VERSION -or $routerVersion -ne $env:RELEASE_VERSION) {
            Write-Error "Expected $env:RELEASE_VERSION in both; the -p:Version override did not flow through."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-msi
          path: release-assets/*.msi
          if-no-files-found: error

  build-tarball:
    name: Build self-contained tar.gz (${{ matrix.rid }})
    needs: [verify-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Cross-published from an ubuntu-latest runner for every RID, including osx-arm64: a self-contained
      # publish only needs that RID's runtime pack restored from NuGet, not a matching host OS/arch -
      # Microsoft.ML.OnnxRuntime/.OnnxRuntimeGenAI and SQLitePCLRaw.bundle_e_sqlite3 (this project's native
      # dependencies) all ship an osx-arm64 asset in the package versions already pinned here.
      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/TotallyHotArcRouter/TotallyHotArcRouter.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishDir=publish/${{ matrix.rid }}
          -p:Version=${{ env.RELEASE_VERSION }}

      - name: Package tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          name="totallyhotarcrouter-${{ matrix.rid }}.tar.gz"
          # packaging/install.sh's own docs (and this repo's README/Dockerfile) all assume
          # packaging/linux/install.sh or packaging/macos/install.sh sits inside the extracted archive
          # root next to the published binaries - copy the repo's packaging/ tree in before archiving, or
          # every release install script this workflow's own comments promise would be missing.
          cp -r packaging "src/TotallyHotArcRouter/publish/${{ matrix.rid }}/packaging"
          # --numeric-owner/root ownership: the archive's UID/GID must not depend on this runner's own
          # accounts - packaging/linux/install.sh and packaging/macos/install.sh both chown the extracted
          # tree themselves.
          tar --numeric-owner --owner=0 --group=0 -czf "release-assets/${name}" \
            -C "src/TotallyHotArcRouter/publish/${{ matrix.rid }}" .
          ls -la release-assets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-tarball-${{ matrix.rid }}
          path: release-assets/*.tar.gz
          if-no-files-found: error

  build-docker:
    name: Build and push multi-arch container image
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/totallyhot-arcrouter
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the version only, never "latest" - promote.yml's own job below does that, matching
      # the two-stage MSI/tarball release exactly: no artifact this workflow builds is "the" release
      # until promote.yml deliberately says so.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TotallyHotArcRouter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The Dockerfile's VERSION build arg becomes -p:Version, same as every other asset above.
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}

  publish-release:
    name: Publish GitHub Release
    needs: [verify-version, build-msi, build-tarball, build-docker]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true

      - name: Compute combined checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          ls -la
          sha256sum *.msi *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.msi
            release-assets/*.tar.gz
            release-assets/checksums.txt
          # Drop-in preamble (one base URL, model: auto) is the release page's first screen; the
          # generated changelog is appended after it. The markdown is produced by
          # OpenAiCompatibleDropIn.BuildReleaseNotesMarkdown and locked by unit test against this file.
          body_path: docs/install/openai-compatible-drop-in.md
          generate_release_notes: true
          # See the two-stage note in this file's header: an RC, not `latest`, until promote.yml says so.
          # make_latest is quoted because it is a tri-state string input ('true'/'false'/'legacy'), not a
          # boolean - quoting keeps that explicit rather than relying on YAML's bool-to-string coercion.
          prerelease: true
          make_latest: "false"
