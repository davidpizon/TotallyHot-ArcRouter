name: "CodeQL"

# GitHub rejects SARIF uploads from repository-defined advanced CodeQL workflows while the
# repository-level CodeQL default setup is enabled. Keep this workflow as a passing compatibility
# check so pull requests do not fail until the repository is switched fully to advanced setup in
# Settings > Code security.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, Monday 00:00 UTC - a baseline scan even without pushes.
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Explain compatibility mode
        run: |
          echo "Repository CodeQL default setup is enabled."
          echo "GitHub rejects uploads from advanced CodeQL workflows while default setup is active."
          echo "This workflow remains as a passing compatibility check until CodeQL is switched fully to advanced setup."
