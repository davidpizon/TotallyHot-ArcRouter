name: "CodeQL"

# Advanced CodeQL setup, scoped to the first-party .NET code under src/. Replaces GitHub's default
# (UI-configured) code scanning, which scans the whole repo - including the vendored
# litellm-sidecar/ component - and produced dashboard noise for code not maintained here. This
# analyzes C# only, so the vendored non-C# code is inherently out of scope.
#
# To activate: in Settings > Code security, switch CodeQL analysis from "Default" to "Advanced"
# (or disable default setup) so this workflow's results populate code scanning.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, Monday 00:00 UTC - a baseline scan even without pushes.
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Manual build mode: build only the cross-platform (net10.0) production code so CodeQL traces it
      # into the analysis database. TotallyHotArcRouter.csproj is the network-facing proxy/router - where the
      # security-relevant surface (request interception, forwarding, logging) and the prior log-forging
      # alerts live - and it pulls in TotallyHotArcRouter.Sandbox via ProjectReference. The Windows-only MAUI
      # projects (TotallyHotArcRouter.Gui, TotallyHotArcRouter.Gui.Tests, net10.0-windows) are deliberately not built:
      # they cannot restore/build on a Linux runner (same exclusion as .github/workflows/dotnet-ci.yml),
      # which is exactly what broke the earlier build-mode: none attempt.
      - name: Build first-party .NET code (excludes Windows-only MAUI projects)
        run: dotnet build src/TotallyHotArcRouter/TotallyHotArcRouter.csproj --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
