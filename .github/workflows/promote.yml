name: Promote release

# Stage two of the two-stage release flow (stage one is release.yml, which always publishes a tagged
# build as a prerelease - a release candidate). This workflow nominates one of those release candidates
# as THE release by flipping it to `latest`.
#
# Deliberately a promotion, not a rebuild: the MSI and checksums.txt already attached to the release are
# left untouched, so the artifact operators install is byte-identical to the one that was tested as the
# RC and the published SHA256 still covers it. It also means the version never changes between the two
# stages - the tag's version, "1.2.3", is stamped into both, so a tester running the RC sees no
# spurious "update available" once the same build becomes latest (GitHubReleaseCheckClient compares
# versions with System.Version, which cannot parse an "-rc.N" suffix at all - hence no such suffix).
#
# The moment this runs, /repos/{owner}/{repo}/releases/latest starts returning this release, and every
# installed Router picks it up on its next UpdateCheckHostedService poll.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote, e.g. v1.2.3 (must already exist as a prerelease)"
        required: true
        type: string

# Editing a release is a release write, which lives under contents. packages:write is needed to retag
# the container image below (web GUI migration plan Phase P10).
permissions:
  contents: write
  packages: write

jobs:
  promote:
    name: Promote ${{ inputs.tag }} to latest
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/totallyhot-arcrouter
    steps:
      # Guard against promoting a release the Router would then reject: GitHubReleaseCheckClient requires
      # exactly one platform-matching installer/archive asset (a *.msi* on Windows, a
      # totallyhotarcrouter-<rid>.tar.gz elsewhere) plus one asset named exactly checksums.txt, and
      # reports anything else as AssetOrChecksumMissing - which surfaces to the operator as a silently
      # unavailable update rather than a loud failure. Catching it here, before the release goes latest,
      # keeps that failure mode out of the field entirely. Only the MSI is checked byte-for-byte against
      # checksums.txt (GitHubReleaseCheckClient's only real download-and-apply path today, per
      # GitHubReleaseCheckClient's own remarks) - the tar.gz presence check below is a packaging-matrix
      # completeness guard, not yet a functional requirement for any client.
      - name: Verify release assets match the update-check contract
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$names" | sed 's/^/  /'

          msi_count=$(echo "$names" | grep -c '\.msi$' || true)
          if [ "$msi_count" -ne 1 ]; then
            echo "::error::$TAG has $msi_count .msi assets; GitHubReleaseCheckClient expects exactly one."
            exit 1
          fi

          for rid in linux-x64 linux-arm64 osx-arm64; do
            if ! echo "$names" | grep -qx "totallyhotarcrouter-${rid}.tar.gz"; then
              echo "::error::$TAG is missing totallyhotarcrouter-${rid}.tar.gz from the P10 packaging matrix."
              exit 1
            fi
          done

          if ! echo "$names" | grep -qx 'checksums.txt'; then
            echo "::error::$TAG has no checksums.txt asset; GitHubReleaseCheckClient cannot verify the MSI."
            exit 1
          fi

          # The checksum line must name the MSI actually attached to this release, in sha256sum's
          # "<hex><two spaces><filename>" format - a checksums.txt left over from a different build
          # would pass the presence check above and still fail verification on the operator's machine.
          msi_name=$(echo "$names" | grep '\.msi$')
          checksums=$(gh release download "$TAG" --pattern checksums.txt --output - )
          if ! echo "$checksums" | grep -qE "^[0-9a-f]{64}  ${msi_name//./\.}$"; then
            echo "::error::checksums.txt has no '<sha256>  $msi_name' line."
            echo "checksums.txt contents:"
            echo "$checksums" | sed 's/^/  /'
            exit 1
          fi

          echo "$TAG carries $msi_name, every P10 tar.gz asset, and a matching checksums.txt line."

      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --prerelease=false --draft=false --latest
          echo "Promoted $TAG. /releases/latest now resolves to it; Routers will offer it on their next poll."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No rebuild, same "the promoted artifact is byte-identical to the tested RC" principle as the
      # release itself: imagetools re-tags the already-pushed multi-arch manifest release.yml built for
      # this tag, rather than running `docker build` again.
      - name: Retag container image as latest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${version}"
          echo "Retagged ${IMAGE}:${version} as ${IMAGE}:latest."
