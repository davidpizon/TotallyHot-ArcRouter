# Temporary, dev/test-only LiteLLM proxy config (PLAN.md TODO 1). Every entry uses `mock_response` so
# the proxy answers deterministically without ever calling a real provider - no API keys, no network
# egress, no cost, no flakiness from live rate limits. `api_key` values below are placeholders LiteLLM's
# startup validation expects to see present, never used since mock_response short-circuits before any
# real call.
#
# Do not add real provider credentials here. This file (and this whole directory) is decommissioned
# once PLAN.md's TODO 4 closes - see litellm-sidecar/README.md.

model_list:
  - model_name: claude-opus-4.6
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: mock-not-a-real-key-parity-testing
      mock_response: "This is a mock response from claude-opus-4.6 for parity testing."

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: mock-not-a-real-key-parity-testing
      mock_response: "This is a mock response from claude-sonnet-4.6 for parity testing."

  - model_name: gpt-5.4
    litellm_params:
