syntax = "proto3";

package TotallyHot.ArcRouter.telemetry.v1;

// Deliberately not "...Grpc": TotallyHot.ArcRouter.Telemetry already has hand-written domain types named
// RoutingTelemetryEvent/LogLineEvent, and Grpc.Core/Grpc.AspNetCore are real NuGet namespaces this
// code also imports - "Grpc" as a nested-namespace segment risks colliding with both. "Contract"
// reads unambiguously as "the wire type", distinct from the domain type of the same short name.
option csharp_namespace = "TotallyHot.ArcRouter.Telemetry.Contract";

import "google/protobuf/timestamp.proto";

// Replaces TotallyHot.ArcRouter.Telemetry.TelemetryHub (SignalR). See
// docs/router/grpc-migration.md for the design this implements. Compiled independently into both
// TotallyHot.ArcRouter (GrpcServices="Server") and TotallyHot.ArcRouter.Gui (GrpcServices="Client") from this one
// file, so the two sides can never structurally drift the way the hand-synced SignalR DTOs could.
//
// GetModelSpend and a ModelListEvent stream case are described in grpc-migration.md's design but are
// intentionally not part of this contract: both would need TotallyHot.ArcRouter.Telemetry's proposed
// IUsageLedger (docs/router/agent-cost-tracking.md), which has no implementation yet. Beyond the two
// event types TotallyHot.ArcRouter.Telemetry.TelemetryHub already sent, this service also carries
// QualitySignalEvent - the quality verifier's live signal - which TelemetryHub never had, since the
// verifier postdates it.
service TelemetryService {
  // Streams every routing telemetry event and log line to a connected client for the lifetime of the
  // call - the gRPC equivalent of today's push-only SignalR hub connection.
  rpc StreamEvents (StreamEventsRequest) returns (stream TelemetryEvent);
}

message StreamEventsRequest {}

// The Governance > Price Sources panel's management plane: read the price feeds' status, switch one on or
// off (docs/router/model-price-catalog.md D6), and trigger an immediate pull.
//
// Separate from TelemetryService rather than more RPCs on it: that service is a push-only event stream for
// the lifetime of a connection, this is unary request/response. They share the :5002 TLS loopback endpoint.
//
// LICENSING - read before adding a field. Every message below carries only feed METADATA: source name,
// enabled flag, rank, row counts, timestamps, error strings. No price value appears here, and none may be
// added. D5 forbids re-serving aggregated price data outward, and while this channel is loopback-only (which
// is why the panel is allowed to exist at all), "the transport happens to be local" is not a reason to let
// price data into a wire contract. A display surface that needs a price reads the SQLite file directly.
service PriceSourceAdminService {
  // Returns every source that has a client, whether enabled or not - a disabled source must still be listed
  // or it could never be switched back on.
  rpc ListPriceSources (ListPriceSourcesRequest) returns (ListPriceSourcesResponse);

  // Enables or disables one source. Disabling also cancels that source's in-flight fetch, if any.
  rpc SetPriceSourceEnabled (SetPriceSourceEnabledRequest) returns (ListPriceSourcesResponse);

  // Runs one ingestion cycle now and waits for it. Serialized against the background poll loop: a call that
  // arrives mid-cycle waits for that cycle rather than starting a second one.
  rpc RefreshPriceSources (RefreshPriceSourcesRequest) returns (RefreshPriceSourcesResponse);

  // Rewrites every source's rank from the submitted order (highest priority first) and then re-resolves
  // every contested cell from prices already in storage under the new order, so the new priority takes
  // effect immediately - without waiting for, or triggering, a live pull from any source. The request must
  // name every existing source exactly once; a partial list is rejected outright rather than best-effort
  // applied. Returns the same shape as RefreshPriceSources because the caller needs the same information
  // (updated sources, schedule, fresh count) - not because a fetch cycle ran; outcomes is always empty here,
  // since no source was fetched.
  rpc ReorderPriceSources (ReorderPriceSourcesRequest) returns (RefreshPriceSourcesResponse);
}

message PriceSource {
  // Removed 2026-07-17: last_updated_utc, a MAX() rollup of this source's price rows. It existed solely for
  // the panel's per-card "Last updated" age, and went with that row. Reserved rather than freed - reusing
  // the number would let an old client decode a new field as a timestamp.
  //
  // Note this is only the per-source rollup. model_prices.last_updated_utc, the per-row timestamp D1's 24h
  // routing floor is expressed in, is untouched and load-bearing.
  reserved 5;
  reserved "last_updated_utc";

  string name = 1;
  bool enabled = 2;
  // Rank arbitrating which source wins a contested (model, provider) cell - higher wins, ties favor the most
  // recent write. User-reorderable via ReorderPriceSources.
  int32 priority_score = 3;
  // How many price rows this source owns - a count, not the prices themselves. 0 for a seeded source that
  // has never polled.
  int32 price_count = 4;
}

message ListPriceSourcesRequest {}

// When the next scheduled ingestion cycle lands, as two facts the client adds together rather than one
// precomputed instant. The client renders the countdown on Governance → Price Sources.
message PriceSchedule {
  // The catalog's poll cadence (PriceCatalogOptions.PollIntervalHours, in the documented 4-12h band).
  int32 poll_interval_seconds = 1;
  // When the current interval started counting: the last completed cycle, or the router's start when none
  // has completed yet. Always set - "no cycle has ever run" is a real schedule, not an absent one, and it is
  // reachable on a router with every source disabled.
  //
  // Deliberately the anchor rather than the last *successful write*: a cycle where every source fails
  // still restarts the interval, but moves no source's last_updated_utc. Anchoring a countdown on the
  // latter would run it negative for the whole of an outage - exactly when the next attempt's timing is
  // what the operator is on this screen to find out.
  google.protobuf.Timestamp schedule_anchor_utc = 2;
}

message ListPriceSourcesResponse {
  repeated PriceSource sources = 1;
  PriceSchedule schedule = 2;
}

message SetPriceSourceEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message RefreshPriceSourcesRequest {}

message ReorderPriceSourcesRequest {
  // Every existing source's name, highest priority first, each named exactly once.
  repeated string source_names_in_priority_order = 1;
}

// Mirrors TotallyHot.ArcRouter.PriceCatalog.SourceOutcome.
message PriceSourceOutcome {
  string source = 1;
  bool succeeded = 2;
  int32 price_count = 3;
  // The failure reason, or "disabled during fetch" when the operator switched the source off mid-pull.
  optional string error = 4;
}

message RefreshPriceSourcesResponse {
  repeated PriceSourceOutcome outcomes = 1;
  int32 fresh_price_count = 2;
  // The full source list after the cycle, so the client can replace its state in one shot rather than
  // issuing a follow-up ListPriceSources - the same convention ProviderAdminEndpoints uses for its mutations.
  repeated PriceSource sources = 3;
  // The schedule after the cycle. This cycle just re-anchored it, so the client's countdown resets off the
  // same response that reports the pull - no follow-up call, and no window where the panel shows a pull it
  // has already completed as still pending.
  PriceSchedule schedule = 4;
}

// The Governance → Benchmark Data panel's management plane: read the CodeRouterBench corpus's sync
// freshness (docs/router/coderouterbench-sqlite-migration-plan.md, Phase 4), force a fresh checksum
// probe, and run a sync with streamed per-file progress.
//
// Separate service, same shape as PriceSourceAdminService: unary reads/mutations plus one streaming RPC,
// sharing the :5002 TLS loopback endpoint. No licensing constraint applies here (unlike price data) -
// the corpus is public benchmark data - so file names, sizes, and row counts are carried freely.
service BenchmarkDataAdminService {
  // Returns the last-computed freshness state (cached in BenchmarkDataStatusService; never null once
  // StartupHealthCheckHostedService's first startup probe has run) plus every file's ledger status.
  rpc GetBenchmarkStatus (GetBenchmarkStatusRequest) returns (BenchmarkStatusResponse);

  // Re-probes Hugging Face now and returns the recomputed state. Distinct from GetBenchmarkStatus so the
  // panel's "Recheck" action is an explicit network call, not implied by every read.
  rpc RecheckBenchmarkData (RecheckBenchmarkDataRequest) returns (BenchmarkStatusResponse);

  // Downloads, verifies, and imports every file in BenchmarkFileSpec.All, streaming one
  // BenchmarkSyncStreamEvent per stage transition so the panel can show live per-file progress through a
  // ~12 MB download rather than sitting silent. The final message on the stream carries the aggregate
  // status (mirroring RefreshPriceSourcesResponse's "full state after the mutation" convention) so the
  // panel's button reflects the new state without a follow-up GetBenchmarkStatus call.
  rpc SyncBenchmarkData (SyncBenchmarkDataRequest) returns (stream BenchmarkSyncStreamEvent);
}

message GetBenchmarkStatusRequest {}

message RecheckBenchmarkDataRequest {}

message SyncBenchmarkDataRequest {}

enum BenchmarkDataState {
  BENCHMARK_DATA_STATE_UNSPECIFIED = 0;
  BENCHMARK_DATA_STATE_CURRENT = 1;
  BENCHMARK_DATA_STATE_UPDATE = 2;
  BENCHMARK_DATA_STATE_CHECK_FAILED = 3;
}

// One file's last-recorded sync, from BenchmarkFileLedger. A file that has never synced is still listed -
// the same way ListPriceSources always lists a disabled source, so the panel has a card to show "Update"
// against - with synced = false and size_bytes/row_count at their proto3 zero value. synced_at_utc is the
// exception: it is a message field, which the service leaves unset rather than zeroing, so it arrives
// *absent*, not as an epoch timestamp. Consumers must null-check it (the C# client maps it through
// `?.ToDateTimeOffset()`) instead of reading 1970 as a real sync time.
message BenchmarkFile {
  string file_name = 1;
  bool synced = 2;
  int64 size_bytes = 3;
  int32 row_count = 4;
  google.protobuf.Timestamp synced_at_utc = 5;
}

message BenchmarkStatusResponse {
  BenchmarkDataState state = 1;
  // The probe failure reason, set only when state is BENCHMARK_DATA_STATE_CHECK_FAILED.
  optional string reason = 2;
  google.protobuf.Timestamp checked_at_utc = 3;
  // Every file BenchmarkFileSpec.All names, in that order - not only ones that have synced.
  repeated BenchmarkFile files = 4;
}

enum BenchmarkSyncStage {
  BENCHMARK_SYNC_STAGE_UNSPECIFIED = 0;
  BENCHMARK_SYNC_STAGE_DOWNLOADING = 1;
  BENCHMARK_SYNC_STAGE_VERIFYING = 2;
  BENCHMARK_SYNC_STAGE_IMPORTING = 3;
  BENCHMARK_SYNC_STAGE_COMPLETED = 4;
  BENCHMARK_SYNC_STAGE_FAILED = 5;
}

// One file's progress update during a sync. Mirrors TotallyHot.ArcRouter.CodeRouterBench.BenchmarkSyncProgress.
message BenchmarkSyncProgressEvent {
  string file_name = 1;
  BenchmarkSyncStage stage = 2;
  optional int64 bytes_transferred = 3;
  optional int32 rows_imported = 4;
  // Set only on a BENCHMARK_SYNC_STAGE_FAILED event.
  optional string error = 5;
  // The file's published size in bytes, from the checksum probe. Set on every progress event for a
  // file that is actually being synced (i.e. never for a file the plan omitted as already current),
  // so the panel can render a "N / total MB" per-file bar without a separate lookup.
  optional int64 total_bytes = 6;
}

// One file the sync is about to download, from the plan computed once at the start of a
// SyncBenchmarkData call - the files whose ledger checksum did not match the published one. A file
// omitted here matched already and is not downloaded or reported via BenchmarkSyncProgressEvent.
message BenchmarkSyncPlanFile {
  string file_name = 1;
  int64 size_bytes = 2;
}

// The sync's plan: which files are stale and how many bytes the whole run will transfer, so the
// panel's cumulative progress bar has a stable denominator from the first byte rather than one that
// grows as each file starts.
message BenchmarkSyncPlanEvent {
  repeated BenchmarkSyncPlanFile files = 1;
  int64 total_bytes = 2;
}

// One message on the SyncBenchmarkData stream: a one-time plan (always first), a per-file progress
// update, or - exactly once, as the final message - the aggregate status after every file has been
// attempted.
message BenchmarkSyncStreamEvent {
  oneof event {
    BenchmarkSyncPlanEvent plan = 3;
    BenchmarkSyncProgressEvent progress = 1;
    BenchmarkStatusResponse final_status = 2;
  }
}

// The Governance → Benchmark Data panel's "Local Voter Model" section: read the llm_router ONNX voter's
// file sync state, switch the model by base URL, and run a download/verify sync with streamed per-file
// progress.
//
// Same shape as BenchmarkDataAdminService (unary reads/mutations plus one streaming RPC), sharing the
// same :5002 TLS loopback endpoint. Deliberately a separate service rather than more RPCs on
// BenchmarkDataAdminService: the two pipelines diverge (this one has no import stage, and adds a
// model-switch mutation the corpus has no equivalent of), and keeping them separate means a client that
// only cares about one doesn't pull in messages for the other.
service LlmRouterModelAdminService {
  // Returns the currently active base URL and every file's cache status. "Current" means every required
  // file is present locally, independent of checksum verification (tracked separately per file via
  // checksum_verified, and only for the most recent in-process sync); model.onnx.data is optional and
  // its absence alone doesn't make the model non-current, since some exports inline its weights into
  // model.onnx. The base URL is a fixed pin, not a rolling ref, so there is no remote freshness check to
  // run, unlike BenchmarkDataAdminService's Recheck.
  rpc GetLlmRouterModelStatus (GetLlmRouterModelStatusRequest) returns (LlmRouterModelStatusResponse);

  // Persists a new base URL as the active model. Does not download - the panel calls SyncLlmRouterModel
  // afterward, the same two-step shape as switching a provider then syncing it.
  rpc SetLlmRouterModelBaseUrl (SetLlmRouterModelBaseUrlRequest) returns (LlmRouterModelStatusResponse);

  // Downloads and checksum-verifies (where possible) the 5 files for the currently active base URL into
  // its per-model cache directory, streaming one LlmRouterModelSyncStreamEvent per stage transition. The
  // final message carries the aggregate status, mirroring SyncBenchmarkData's convention.
  rpc SyncLlmRouterModel (SyncLlmRouterModelRequest) returns (stream LlmRouterModelSyncStreamEvent);
}

message GetLlmRouterModelStatusRequest {}

message SetLlmRouterModelBaseUrlRequest {
  string base_url = 1;
}

message SyncLlmRouterModelRequest {}

// One of the 5 files (genai_config.json, tokenizer.json, tokenizer_config.json, model.onnx,
// model.onnx.data) the llm_router ONNX voter needs. A file that has never synced is still listed, with
// synced = false, the same convention BenchmarkFile uses.
message LlmRouterModelFile {
  string file_name = 1;
  bool synced = 2;
  int64 size_bytes = 3;
  google.protobuf.Timestamp synced_at_utc = 4;
  // True when the sync verified this file's checksum against Hugging Face's models-tree API; false when
  // the URL wasn't in the expected Hugging Face shape, the API call failed, or the file simply hasn't
  // been checksum-verified by a sync in this process's lifetime - in which case only the file's local
  // existence and size are known.
  bool checksum_verified = 5;
  // True only for model.onnx.data: some exports inline all weights into model.onnx and never publish this
  // file, so the panel needs to tell that expected, permanent absence apart from an unsynced required
  // file rather than rendering both as "Not synced".
  bool is_optional = 6;
}

message LlmRouterModelStatusResponse {
  string base_url = 1;
  // Always the 5 files above, in fixed order - not only ones that have synced.
  repeated LlmRouterModelFile files = 2;
  bool current = 3;
}

enum LlmRouterModelSyncStage {
  LLM_ROUTER_MODEL_SYNC_STAGE_UNSPECIFIED = 0;
  LLM_ROUTER_MODEL_SYNC_STAGE_DOWNLOADING = 1;
  LLM_ROUTER_MODEL_SYNC_STAGE_VERIFYING = 2;
  LLM_ROUTER_MODEL_SYNC_STAGE_COMPLETED = 3;
  LLM_ROUTER_MODEL_SYNC_STAGE_FAILED = 4;
}

// One file's progress update during a sync. No rows_imported field, unlike BenchmarkSyncProgressEvent -
// this pipeline has no import stage.
message LlmRouterModelSyncProgressEvent {
  string file_name = 1;
  LlmRouterModelSyncStage stage = 2;
  optional int64 bytes_transferred = 3;
  // Set only on a LLM_ROUTER_MODEL_SYNC_STAGE_FAILED event.
  optional string error = 4;
  // The file's published size in bytes, from the checksum probe, when known.
  optional int64 total_bytes = 5;
}

// One file the sync is about to download, from the plan computed once at the start of a
// SyncLlmRouterModel call - the files that are missing locally, or whose cached bytes no longer match
// the published size/checksum. A file omitted here was already current and is not downloaded.
message LlmRouterModelSyncPlanFile {
  string file_name = 1;
  int64 size_bytes = 2;
}

// The sync's plan: which files are stale and how many bytes the whole run will transfer, so the
// panel's cumulative progress bar has a stable denominator from the first byte rather than one that
// grows as each file starts.
message LlmRouterModelSyncPlanEvent {
  repeated LlmRouterModelSyncPlanFile files = 1;
  int64 total_bytes = 2;
}

// One message on the SyncLlmRouterModel stream: a one-time plan, per-file progress updates, or -
// exactly once, as the final message - the aggregate status after every file has been attempted. The
// plan, when present, always arrives first, before any progress event.
message LlmRouterModelSyncStreamEvent {
  oneof event {
    LlmRouterModelSyncPlanEvent plan = 3;
    LlmRouterModelSyncProgressEvent progress = 1;
    LlmRouterModelStatusResponse final_status = 2;
  }
}

// The Governance → Routing Mode panel: a read-only surface reporting whether the Orchestrator ensemble
// (PLAN.md Phase L) is live, each of its voters' enablement and weight, and the exploration setting -
// docs/router/orchestrator-live-path-plan.md §M3.2. No mutation RPC: flipping any of these is an
// appsettings.json change and a process restart, not a GUI action - M3.2's documented deferral leaves an
// editable toggle as a separate config-management sub-project. Same shape as the other admin services
// above (unary, sharing the :5002 TLS loopback endpoint) but always mapped, unlike them: routing
// configuration is core, not an optional feature gated on an external store being supplied.
service RoutingModeAdminService {
  // Returns the routing options currently bound into RoutingOptions.
  rpc GetRoutingMode (GetRoutingModeRequest) returns (RoutingModeResponse);
}

message GetRoutingModeRequest {}

// One voter's participation in the Orchestrator's weighted vote (PLAN.md Phase L, research-doc §3.3).
message VoterMode {
  string name = 1;
  bool enabled = 2;
  double weight = 3;
}

message RoutingModeResponse {
  // RoutingOptions.EnableOrchestratorPolicy - whether CompositeRoutingPolicy dispatches non-utility
  // traffic to OrchestratorRoutingPolicy (true) or AgentRouterPolicy (false). The Phase M kill switch.
  bool orchestrator_enabled = 1;
  bool exploration_enabled = 2;
  double exploration_rate = 3;
  // Always every voter, in dim_best / memory_kNN / logreg / llm_router / cluster_best order, regardless
  // of orchestrator_enabled - the panel reports the configuration that would apply if the Orchestrator
  // were live, not only when it currently is. The first four ship with PLAN.md Phase L; cluster_best was
  // added by docs/router/self-organizing-classification-plan.md Phase T3 and is reported the same way,
  // un-gated on the adaptive-routing master switch, since this field carries configuration rather than
  // current activity.
  repeated VoterMode voters = 4;
}

// The Governance UI's System Settings window's "Adaptive Routing" and "Shadow Judge" rows
// (docs/router/self-organizing-classification-plan.md Phase T6, docs/router/geval-shadow-scoring-plan.md):
// reads and mutates the router_settings-backed overrides layered on top of RoutingOptions
// (EnableAdaptiveRouting, EmbeddingMemoryCapacity) and JudgeOptions (Enabled, ModelName). The judge
// settings share this service because they share the router_settings table and the window's single Save
// button - one write, one reload token trigger, one response carrying the whole post-mutation state.
// Deliberately a separate service from the read-only RoutingModeAdminService above
// (§M3.2's settled "read-only reporting and settings mutation stay separate" convention) - this is the one
// admin service on this endpoint that mutates RoutingOptions. Same shape as ClusterModelAdminService/
// BenchmarkDataAdminService (unary read plus a mutating RPC), sharing the :5002 TLS loopback endpoint.
service RouterSettingsAdminService {
  // Returns the settings' currently effective values - i.e. IOptionsMonitor<RoutingOptions>.CurrentValue,
  // which already reflects stored-override > appsettings.json > coded-default precedence - not the raw
  // router_settings rows.
  rpc GetRouterSettings (GetRouterSettingsRequest) returns (RouterSettingsResponse);

  // Validates and persists both settings to router_settings, triggers the live-reload change token so
  // IOptionsMonitor<RoutingOptions> picks them up immediately, and - when EmbeddingMemoryCapacity was
  // lowered - trims memory_entries to the new bound before returning. Rejects an out-of-range capacity with
  // a structured INVALID_ARGUMENT error rather than silently clamping it; the response always re-reads the
  // post-mutation effective values, mirroring RetrainClusterModel's "true post-mutation state" convention.
  rpc UpdateRouterSettings (UpdateRouterSettingsRequest) returns (RouterSettingsResponse);
}

message GetRouterSettingsRequest {}

// embedding_memory_capacity's valid range, enforced by UpdateRouterSettings - INVALID_ARGUMENT rejects any
// value outside it rather than clamping. Mirrors the GUI's own client-side min/max on the Sample Size input.
message UpdateRouterSettingsRequest {
  bool adaptive_routing_enabled = 1;
  int32 embedding_memory_capacity = 2;

  // The shadow judge's master switch (docs/router/geval-shadow-scoring-plan.md). Also authorizes retaining
  // raw response text in memory long enough to judge it, so switching it off stops that retention too.
  bool judge_enabled = 3;

  // The operator's chosen judge backbone, as a client-facing model name from the Providers screen. Empty
  // means automatic - take the first eligible free model. A non-empty name that is not currently eligible
  // is rejected with INVALID_ARGUMENT rather than silently falling back, so the window cannot save a
  // choice that would not actually be honored.
  string judge_model_name = 4;
}

message RouterSettingsResponse {
  bool adaptive_routing_enabled = 1;
  int32 embedding_memory_capacity = 2;
  bool judge_enabled = 3;

  // The stored choice, echoed back verbatim - empty for automatic. This is the operator's setting, not
  // necessarily the model that will run: an eligible-at-save-time pick can stop being eligible later, and
  // the selector falls back at that point without rewriting the setting.
  string judge_model_name = 4;

  // Every model currently eligible to serve as the judge backbone - free provider, provider and model both
  // enabled, OpenAI-compatible - in configuration order. Populates the window's dropdown, and is empty when
  // no free provider is configured, which is the honest "the judge has nothing to call" state.
  repeated string eligible_judge_models = 5;
}

// The Governance UI's Cluster Model panel (docs/router/self-organizing-classification-plan.md Phase T5):
// reports the trained self-organizing cluster model's status and runs a retrain with streamed
// bootstrap-embedding progress. Also surfaces the transcript retention settings that gate the corpus this
// model trains from, since this panel is their closest existing home - see
// TotallyHot.ArcRouter.Transcripts.TranscriptOptions. Same shape as the other admin services (unary status
// read plus one streaming mutation RPC), sharing the :5002 TLS loopback endpoint.
service ClusterModelAdminService {
  // Returns the current artifact's status (or the honest "no artifact yet" state) plus transcript
  // retention context.
  rpc GetClusterModelStatus (GetClusterModelStatusRequest) returns (ClusterModelStatusResponse);

  // Runs IClusterTrainingService.RetrainAsync, streaming one ClusterRetrainBootstrapProgress event per
  // OOD bootstrap embedding tick, then exactly one ClusterRetrainResult carrying the outcome and the
  // fresh post-mutation status - mirrors SyncBenchmarkData's "full state after the mutation" convention.
  rpc RetrainClusterModel (RetrainClusterModelRequest) returns (stream ClusterRetrainStreamEvent);
}

message GetClusterModelStatusRequest {}

message RetrainClusterModelRequest {}

// One trained artifact's status, or the honest "no artifact yet" state (artifact_present = false, every
// other artifact-derived field at its proto3 zero value) on a fresh install. retention_days,
// max_transcript_rows, and current_transcript_row_count are always populated regardless of
// artifact_present - they describe the transcript corpus this model trains from, not the model itself.
message ClusterModelStatusResponse {
  bool artifact_present = 1;
  int32 chosen_k = 2;
  google.protobuf.Timestamp trained_at_utc = 3;
  // Human-readable provenance: source mix, the k-selection sweep's outcome, and the training date -
  // ClusterModelArtifact.TrainedFrom verbatim.
  string trained_from = 4;
  // Parallel to cluster_names: cluster_sizes[i] is the training-sample count for cluster_names[i].
  repeated int32 cluster_sizes = 5;
  repeated string cluster_names = 6;
  int32 bootstrap_task_count = 7;
  int32 memory_entry_count = 8;
  // Live memory_entries rows accumulated since this artifact's memory_entry_count was recorded (or,
  // when artifact_present is false, every live entry that exists) - the same threshold comparison
  // Hosting.ClusterRetrainHostedService makes, surfaced for an operator deciding whether to retrain by
  // hand.
  int32 entries_since_last_retrain = 9;
  int32 retention_days = 10;
  int32 max_transcript_rows = 11;
  int32 current_transcript_row_count = 12;
}

enum ClusterRetrainResultKind {
  CLUSTER_RETRAIN_RESULT_KIND_UNSPECIFIED = 0;
  CLUSTER_RETRAIN_RESULT_KIND_TRAINED = 1;
  CLUSTER_RETRAIN_RESULT_KIND_DECLINED = 2;
  CLUSTER_RETRAIN_RESULT_KIND_ALREADY_RUNNING = 3;
}

// One bootstrap-embedding progress tick during a retrain - IClusterTrainingService.RetrainAsync's
// IProgress<int> callback, reporting OOD bootstrap tasks embedded so far.
message ClusterRetrainBootstrapProgress {
  int32 tasks_embedded = 1;
}

// The retrain's outcome: which ClusterTrainingResultKind category it fell into, a human-readable
// message, and the fresh status computed immediately afterward.
message ClusterRetrainResult {
  ClusterRetrainResultKind kind = 1;
  string message = 2;
  ClusterModelStatusResponse status = 3;
}

// One message on the RetrainClusterModel stream: zero or more bootstrap_progress events (only while an
// OOD corpus is synced and being embedded), followed by exactly one result as the final message.
message ClusterRetrainStreamEvent {
  oneof event {
    ClusterRetrainBootstrapProgress bootstrap_progress = 1;
    ClusterRetrainResult result = 2;
  }
}

// The Governance UI's Router Model panel (docs/router/live-feedback-learning-plan.md Phase 5): reports
// the trained logreg voter's status and runs a retrain with streamed bootstrap-embedding progress. Same
// shape as ClusterModelAdminService above (unary status read plus one streaming mutation RPC), sharing
// the :5002 TLS loopback endpoint - this is the logreg voter's admin surface the way ClusterModelAdminService
// is the cluster_best voter's.
service RouterModelAdminService {
  // Returns the current artifact's status (or the honest "no artifact yet" state) plus the retrain
  // threshold/live-sample-weight context that always applies regardless of artifact presence.
  rpc GetLogRegModelStatus (GetLogRegModelStatusRequest) returns (LogRegModelStatusResponse);

  // Runs IEmbeddingLogRegTrainingService.RetrainAsync, streaming one LogRegRetrainBootstrapProgress event
  // per OOD bootstrap embedding tick, then exactly one LogRegRetrainResult carrying the outcome and the
  // fresh post-mutation status - mirrors RetrainClusterModel's "full state after the mutation" convention.
  rpc RetrainLogRegModel (RetrainLogRegModelRequest) returns (stream LogRegRetrainStreamEvent);
}

message GetLogRegModelStatusRequest {}

message RetrainLogRegModelRequest {}

// One trained artifact's status, or the honest "no artifact yet" state (artifact_present = false, every
// other artifact-derived field at its proto3 zero value) on a fresh install. retrain_threshold and
// live_sample_weight are always populated regardless of artifact_present - they describe the retrain
// configuration, not the model itself.
message LogRegModelStatusResponse {
  bool artifact_present = 1;
  int32 embedding_dimension = 2;
  // The artifact file's on-disk last-write time, since EmbeddingLogRegModelArtifact itself carries no
  // trained-at field (its provenance date lives only inside trained_from's free text).
  google.protobuf.Timestamp trained_at_utc = 3;
  string trained_from = 4;
  int32 bootstrap_task_count = 5;
  int32 memory_entry_count = 6;
  int32 models_represented = 7;
  // Live memory_entries rows accumulated since this artifact's memory_entry_count was recorded (or,
  // when artifact_present is false, every live entry that exists) - the same threshold comparison
  // Hosting.LogRegRetrainHostedService makes, surfaced for an operator deciding whether to retrain by hand.
  int32 entries_since_last_retrain = 8;
  int32 retrain_threshold = 9;
  double live_sample_weight = 10;
}

enum LogRegRetrainResultKind {
  LOG_REG_RETRAIN_RESULT_KIND_UNSPECIFIED = 0;
  LOG_REG_RETRAIN_RESULT_KIND_TRAINED = 1;
  LOG_REG_RETRAIN_RESULT_KIND_DECLINED = 2;
  LOG_REG_RETRAIN_RESULT_KIND_ALREADY_RUNNING = 3;
}

// One bootstrap-embedding progress tick during a retrain - IEmbeddingLogRegTrainingService.RetrainAsync's
// IProgress<int> callback, reporting OOD bootstrap tasks embedded so far.
message LogRegRetrainBootstrapProgress {
  int32 tasks_embedded = 1;
}

// The retrain's outcome: which LogRegTrainingResultKind category it fell into, a human-readable message,
// and the fresh status computed immediately afterward.
message LogRegRetrainResult {
  LogRegRetrainResultKind kind = 1;
  string message = 2;
  LogRegModelStatusResponse status = 3;
}

// One message on the RetrainLogRegModel stream: zero or more bootstrap_progress events (only while an OOD
// corpus is synced and being embedded), followed by exactly one result as the final message.
message LogRegRetrainStreamEvent {
  oneof event {
    LogRegRetrainBootstrapProgress bootstrap_progress = 1;
    LogRegRetrainResult result = 2;
  }
}

// Envelope: exactly one of these is set per message, matching SignalR's per-message-type dispatch
// ("RoutingTelemetry" / "LogLine" client methods) with a single Protobuf idiom.
message TelemetryEvent {
  oneof event {
    RoutingTelemetryEvent routing_telemetry = 1;
    LogLineEvent log_line = 2;
    QualitySignalEvent quality_signal = 3;
  }
}

// Field names map 1:1 onto TotallyHot.ArcRouter.Telemetry.RoutingTelemetryEvent's C# properties (snake_case
// per Protobuf convention instead of PascalCase) - a wire-format and codegen change, not a
// data-model redesign.
message RoutingTelemetryEvent {
  string session_id = 1;
  int32 turn_number = 2;
  bool is_session_synthesized = 3;
  string requested_model = 4;
  string resolved_model = 5;
  string provider = 6;
  bool is_fallback = 7;
  optional int32 prompt_tokens = 8;
  optional int32 completion_tokens = 9;
  // decimal, not double: see "Decimal encoding" in docs/router/grpc-migration.md - binary floating
  // point loses precision on currency values, which isn't acceptable for a cost-tracking field.
  // Encoded/decoded via decimal.ToString(CultureInfo.InvariantCulture) / decimal.Parse(...,
  // CultureInfo.InvariantCulture) on each end.
  optional string estimated_cost_usd = 10;
  bool is_streaming = 11;
  int64 latency_to_headers_ms = 12;
  int64 total_duration_ms = 13;
  int32 status_code = 14;
  google.protobuf.Timestamp timestamp_utc = 15;
  optional string request_summary = 16;
  optional string response_summary = 17;
  optional int32 cache_creation_tokens = 18;
  optional int32 cache_read_tokens = 19;
  // TotallyHot.ArcRouter.Telemetry.CostConfidence serialized via Enum.ToString()/Enum.Parse() on each end,
  // matching the ledger's own cost_confidence column (docs/router/token-tracking-implementation-plan.md
  // Phase 3, §5.6). optional (not a plain field) only so an old client, which has no such enum member to
  // default to, can distinguish "not sent" from any real value - though every writer always sets it.
  optional string cost_confidence = 20;
  // The router's own token consumption for this request (embedding inference today), and its USD cost at
  // Routing:SelfHostedRouterPricePerMillionTokens. Carried so a dashboard can report savings net of what
  // routing itself cost - research-doc §5.1 charges router tokens into TotTok alongside model tokens.
  // Both are `optional` purely for presence tracking against an older writer that sends neither; a
  // receiver treats absence as zero, which is also what a writer sends when no embedding was computed.
  // router_cost_usd is decimal-as-string for the same precision reason as estimated_cost_usd above.
  optional int32 router_tokens = 21;
  optional string router_cost_usd = 22;
  // The router's client-facing name for the model that actually served the request (post-failover,
  // post-substitution). Plain (not optional), matching requested_model/resolved_model's own convention -
  // every current writer always sets it.
  string routed_model = 23;
  // TotallyHot.ArcRouter.Telemetry.RoutingSubstitutionReason serialized via Enum.ToString()/Enum.Parse() on
  // each end, same convention as cost_confidence above. Plain (not optional): None is a real,
  // always-present value on every current writer, not an absent one.
  string substitution_reason = 24;
}

message LogLineEvent {
  google.protobuf.Timestamp timestamp_utc = 1;
  string level = 2;
  string message = 3;
}

// Field names map 1:1 onto TotallyHot.ArcRouter.Telemetry.QualitySignalEvent's C# properties, same convention
// as RoutingTelemetryEvent above. Powers the dashboard's live quality-verification tile - a heuristic
// quality proxy for live traffic, not a paper-grade metric.
//
// Fields 6, 8, 9, 10, 12, and 13 are reserved, not reused: they carried the isolation tier, executed
// flag, exit code, timed-out flag, wall-clock duration, and peak memory of a verifier that ran the
// model's code. That verifier is gone and nothing replaces those readings, so their numbers are retired
// rather than recycled - a stored v1 envelope decoded by a current reader must not find a new meaning
// sitting on an old field.
message QualitySignalEvent {
  reserved 6, 8, 9, 10, 12, 13;
  reserved "tier", "executed", "exit_code", "timed_out", "wall_clock_ms", "peak_memory_bytes";

  string correlation_id = 1;
  string session_id = 2;
  string dimension = 3;
  string model = 4;
  string language = 5;
  bool syntax_valid = 7;
  double unified_score = 11;
  google.protobuf.Timestamp timestamp_utc = 14;
  bool syntax_authoritative = 15;
  optional double analysis_score = 16;
  optional double judge_score = 17;
  optional string degraded_reason = 18;
}

// The GUI's System Settings window's "Software Update" section (docs/router/auto-update-plan.md
// Phase 2): reads the Router's last-known self-update check outcome, forces an immediate re-check, and
// triggers an apply. Same shape as the other admin services (unary reads/mutations), sharing the :5002
// TLS loopback endpoint. Unlike the optional feature groups (LlmRouterModelAdmin, ClusterModelAdmin,
// etc.), this service is mapped unconditionally, the same way RoutingModeAdminService is - update status
// is core operational state, not an optional add-on.
//
// ApplyUpdate deliberately does not stream progress: it downloads and checksum-verifies the release
// asset, and if that succeeds, launches TotallyHotArcRouter.Updater.exe as a detached process and
// returns immediately with a "handoff succeeded" status. It cannot observe what happens after that,
// because the updater's next act is to stop the very Windows Service this RPC is running inside of.
service UpdateAdminService {
  // Returns the last-known check outcome from IUpdateStateStore - never null after the background
  // poller's first tick, and "no check has run yet" (every field at its proto3 zero value, unavailable
  // reason UNSPECIFIED, checked_at_utc unset) beforehand.
  rpc GetUpdateStatus (GetUpdateStatusRequest) returns (UpdateStatusResponse);

  // Forces an immediate IReleaseCheckClient.CheckAsync call, records the outcome into IUpdateStateStore,
  // and returns the fresh status - the GUI's "Check Now" button.
  rpc CheckForUpdatesNow (CheckForUpdatesNowRequest) returns (UpdateStatusResponse);

  // Downloads and checksum-verifies the currently-known-available update's release asset and, only if
  // that succeeds, launches the detached updater process. Rejected with FAILED_PRECONDITION when no
  // verified update is currently known available (i.e. the caller must GetUpdateStatus/CheckForUpdatesNow
  // first) - the GUI's "Apply Update" button, gated behind its own confirmation dialog since this
  // restarts the Router service.
  rpc ApplyUpdate (ApplyUpdateRequest) returns (ApplyUpdateResponse);
}

message GetUpdateStatusRequest {}

message CheckForUpdatesNowRequest {}

message ApplyUpdateRequest {}

// Mirrors TotallyHot.ArcRouter.Update.ReleaseCheckUnavailableReason.
enum UpdateUnavailableReason {
  UPDATE_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  UPDATE_UNAVAILABLE_REASON_NONE = 1;
  UPDATE_UNAVAILABLE_REASON_NO_RELEASES_PUBLISHED = 2;
  UPDATE_UNAVAILABLE_REASON_MALFORMED_TAG = 3;
  UPDATE_UNAVAILABLE_REASON_ASSET_OR_CHECKSUM_MISSING = 4;
  UPDATE_UNAVAILABLE_REASON_NETWORK_OR_API_FAILURE = 5;
}

message UpdateStatusResponse {
  string current_version = 1;
  // Empty when the latest version could not be determined (see unavailable_reason).
  string latest_version = 2;
  bool update_available = 3;
  // Unset ("no check has run yet") only before the background poller's first tick.
  google.protobuf.Timestamp checked_at_utc = 4;
  UpdateUnavailableReason unavailable_reason = 5;
  optional string unavailable_detail = 6;
}

message ApplyUpdateResponse {
  bool succeeded = 1;
  string message = 2;
}

